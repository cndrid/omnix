# fly.toml app configuration file generated for omnix-h6cnva on 2026-11-16T17:48:36Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'omnix-h6cnva'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  OMNIX_PUBLIC_URL = 'https://omnix-h6cnva.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
