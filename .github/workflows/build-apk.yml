name: Build APK

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Install dependencies
        working-directory: omniX-app
        run: flutter pub get

      - name: Point default backend URL to Fly
        working-directory: omniX-app
        run: |
          sed -i 's|http://127.0.0.1:8000|https://omnix-h6cnva.fly.dev|g' lib/providers/app_providers.dart lib/services/api_service.dart lib/views/profile_view.dart
          grep -rn "omnix-h6cnva.fly.dev" lib/providers/app_providers.dart lib/services/api_service.dart

      - name: Build APK release
        working-directory: omniX-app
        run: flutter build apk --release

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: OmniX APK build ${{ github.run_number }}
          files: omniX-app/build/app/outputs/flutter-apk/app-release.apk
