name: omnix_app
description: Cross-platform YouTube Music client built with Flutter, Riverpod, just_audio, and Chewie. Fully client-side, no cloud backend.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  just_audio: ^0.9.38
  audio_service: ^0.18.13
  audio_session: ^0.1.21
  video_player: ^2.8.6
  chewie: ^1.8.1
  youtube_explode_dart: ^3.1.0
  path_provider: ^2.1.0
  permission_handler: ^12.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
